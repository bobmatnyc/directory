name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # On a pull request the checker comes from main, not from the pull request,
      # so a change can't rewrite the check it has to pass.
      TOOLS: ${{ github.event_name == 'pull_request' && 'base' || 'pr' }}
      BASE: ${{ github.event_name == 'pull_request' && '--base base' || '' }}
      MAINTAINER: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '--maintainer' || '' }}
    steps:
      - name: The files to check
        uses: actions/checkout@v4
        with:
          path: pr
      - name: What they change (main)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix "$TOOLS"
      - name: Every file is complete and well-formed
        run: node "$TOOLS/scripts/check.mjs" --data pr $BASE $MAINTAINER
      - name: The links load
        run: node "$TOOLS/scripts/check.mjs" --data pr $BASE $MAINTAINER --links
        env:
          GITHUB_TOKEN: ${{ github.token }}
